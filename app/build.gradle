plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.voicevoxtts'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.voicevoxtts'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1-poc'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

dependencies {
    implementation 'jp.hiroshiba.voicevoxcore:voicevoxcore-android:0.17.0'
}
